name: HeadDB
description: ${project.description}
author: TheSilentPro (Silent)

main: com.bitworksmc.headdb.core.HeadDB
version: ${project.version}
softdepend: [
  #"PlaceholderAPI",
  "Vault"
]
api-version: '1.21'
folia-supported: true
libraries:
  - "org.xerial:sqlite-jdbc:${sqlite.version}"
  - "com.mysql:mysql-connector-j:${mysql.version}"

spigot-id: 84967

commands:
  headdb:
    usage: /headdb help
    description: Open the database
    aliases: ["hdb", "headdatabase", "headmenu"]

permissions:
  headdb.admin:
    description: Grants all HeadDB commands and categories.
    default: op
    children:
      headdb.command.open: true
      headdb.command.search: true
      headdb.command.give: true
      headdb.command.info: true
      headdb.command.sounds: true
      headdb.command.submit: true
      headdb.command.status: true
      headdb.command.sync: true
      headdb.command.reload: true
      headdb.command.inspect: true
      headdb.command.recent: true
      headdb.command.language: true
      headdb.update.notify: true
      headdb.category.*: true
      headdb.category.favorites: true
      headdb.favorites: true
      headdb.category.local: true
      headdb.category.custom: true
  headdb.command.open:
    description: Allows opening HeadDB and its category menus.
    default: op
  headdb.command.search:
    description: Allows searching the head database.
    default: op
  headdb.command.give:
    description: Allows giving a database head by command.
    default: op
  headdb.command.info:
    description: Allows viewing HeadDB and server version information.
    default: op
  headdb.command.sounds:
    description: Allows toggling personal HeadDB interface sounds.
    default: true
  headdb.command.submit:
    description: Shows a clickable link to the HeadDB submission page.
    default: true
  headdb.command.status:
    description: Shows catalog revision, source, count, and synchronization health.
    default: op
  headdb.command.sync:
    description: Synchronizes the managed head catalog immediately.
    default: op
  headdb.command.reload:
    description: Reloads messages, sounds, menus, prices, website links, and local categories.
    default: op
  headdb.command.inspect:
    description: Inspects a held or identified HeadDB head and links to its web page.
    default: true
  headdb.command.recent:
    description: Browses the most recently assigned catalog IDs.
    default: true
  headdb.command.language:
    description: Selects a personal HeadDB message language.
    default: true
  headdb.update.notify:
    description: Notifies the player when a newer HeadDB release is available.
    default: op
  headdb.favorites:
    description: Legacy alias for headdb.category.favorites.
    default: op
    children:
      headdb.category.favorites: true
  headdb.category:
    description: Parent alias that grants all HeadDB categories.
    default: op
    children:
      headdb.category.*: true
  headdb.category.*:
    description: Grants all HeadDB categories; category-specific false values take precedence.
    default: op
    children:
      headdb.category.local: true
      headdb.category.custom: true
      headdb.category.favorites: true
  headdb.category.local:
    description: Allows access to heads generated from players known to this server.
    default: op
  headdb.category.custom:
    description: Allows access to the custom-categories menu.
    default: op
  headdb.category.favorites:
    description: Allows access to the favorites menu.
    default: op
