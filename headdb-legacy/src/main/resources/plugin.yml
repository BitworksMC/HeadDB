name: HeadDB
description: ${project.description}
author: TheSilentPro (Silent)
main: com.bitworksmc.headdb.legacy.LegacyHeadDB
version: ${project.version}

commands:
  headdb:
    usage: /headdb [info|open|search|give|sounds|submit|status|sync|reload|inspect|recent|language]
    description: Search and give heads from HeadDB
    aliases: [hdb, headdatabase]

permissions:
  headdb.admin:
    description: Grants every legacy HeadDB command.
    default: op
    children:
      headdb.command.search: true
      headdb.command.give: true
      headdb.command.info: true
      headdb.command.sounds: true
      headdb.command.open: true
      headdb.command.submit: true
      headdb.command.status: true
      headdb.command.sync: true
      headdb.command.reload: true
      headdb.command.inspect: true
      headdb.command.recent: true
      headdb.command.language: true
      headdb.category.*: true
      headdb.update.notify: true
  headdb.command.search:
    default: op
  headdb.command.give:
    default: op
  headdb.command.info:
    default: true
  headdb.command.sounds:
    default: true
  headdb.command.open:
    default: op
  headdb.command.submit:
    default: true
  headdb.command.status:
    default: op
  headdb.command.sync:
    default: op
  headdb.command.reload:
    default: op
  headdb.command.inspect:
    default: true
  headdb.command.recent:
    default: true
  headdb.command.language:
    default: true
  headdb.category.*:
    default: op
  headdb.category.favorites:
    default: op
  headdb.category.local:
    default: op
  headdb.category.custom:
    default: op
  headdb.update.notify:
    default: op
